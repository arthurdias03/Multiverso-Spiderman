[project]
name = "spotifibr"
version = "0.1.0"
description = "spotifiBR: suas playlists do Spotify offline no Amazfit T-Rex 3 (painel no computador + servidor para o app do relógio)"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
tags = ["mutagen>=1.47"]

[project.scripts]
spotifibr = "spotifibr.panel_entry:main"

[tool.setuptools]
packages = ["spotifibr"]

[tool.setuptools.package-data]
spotifibr = ["static/*"]
